name: Model change
description: Propose or implement a change to the electromagnetic/SAR model.
title: "[Model] "
labels: ["modeling", "physics"]
body:
  - type: dropdown
    id: level
    attributes:
      label: Target model level
      options: [L0 coefficients, L1 separable modulation, L2 point-scatterer raw echo, L3 position-aware aperture, L4 full-wave or hardware]
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current model and limitation
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed formulas and implementation
    validations:
      required: true
  - type: textarea
    id: conventions
    attributes:
      label: Axes, signs, phases, units and normalization
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance tests
    validations:
      required: true

