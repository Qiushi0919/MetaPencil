name: Bug report
description: Report a reproducible code or result defect.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: commit
    attributes:
      label: Commit hash
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and parameters
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and physical basis
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: Logs and result paths

